[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "two-assay-adsorption-transfer"
version = "0.1.0"
description = "Influence-constrained residual calibration and two-assay design"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
